      :root {
        --bg: #070910;
        --surface: #0d0f18;
        --border: #1a1d2e;
        --accent: #5b8dee;
        --accent-dim: rgba(91, 141, 238, 0.1);
        --text: #e2e8f0;
        --muted: #4a5068;
        --font: "DM Sans", sans-serif;
        --mono: "DM Mono", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      /* Demo banner */
      .demo-banner {
        background: linear-gradient(
          90deg,
          rgba(91, 141, 238, 0.15),
          rgba(167, 139, 250, 0.15)
        );
        border-bottom: 1px solid rgba(91, 141, 238, 0.2);
        padding: 10px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .demo-banner strong {
        color: var(--accent);
      }
      .demo-banner a {
        color: var(--accent);
        text-decoration: none;
      }
      .demo-banner a:hover {
        text-decoration: underline;
      }

      /* Header */
      header {
        padding: 20px 32px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .logo {
        width: 36px;
        height: 36px;
        background: var(--accent);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }
      .header-title {
        flex: 1;
      }
      .header-title h1 {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--text);
      }
      .header-title p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .header-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-family: var(--font);
        font-size: 12px;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .header-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* Stats */
      .stats {
        display: flex;
        gap: 12px;
        padding: 20px 32px;
      }
      .stat {
        flex: 1;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
      }
      .stat-val {
        font-size: 24px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .stat-label {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 6px;
        font-weight: 500;
      }

      /* Board */
      .board {
        display: flex;
        gap: 16px;
        padding: 0 32px 32px;
        overflow-x: auto;
        align-items: flex-start;
      }
      .column {
        flex: 0 0 250px;
        display: flex;
        flex-direction: column;
      }
      .col-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 12px;
      }
      .col-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .col-count {
        font-size: 11px;
        font-weight: 700;
        border-radius: 20px;
        padding: 2px 8px;
      }
      .empty {
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }

      /* Card */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 8px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          transform 0.2s;
        animation: slideIn 0.2s ease;
      }
      .card:hover {
        transform: translateY(-1px);
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .card-company {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-role {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-count {
        font-size: 10px;
        font-weight: 700;
        border-radius: 20px;
        padding: 2px 8px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .dots {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 10px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot-line {
        width: 12px;
        height: 1px;
        background: var(--border);
      }
      .card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }
      .card-platform {
        font-size: 12px;
      }
      .card-platform span {
        color: var(--muted);
        font-size: 10px;
      }
      .card-date {
        font-size: 10px;
        color: var(--muted);
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        animation: fadeIn 0.15s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
        width: 580px;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
        animation: slideUp 0.2s ease;
      }

        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {

          transform: translateY(0);
        }
      }

        font-weight: 700;
        color: var(--text);
      }

        color: var(--muted);
        margin-top: 4px;
      }
      .modal-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 20px;
      }

        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        padding: 2px;
        margin-left: 8px;

      .modal-meta {
        display: flex;
        gap: 16px;
        margin-bottom: 16px;
        padding: 12px;
        background: var(--bg);
        border-radius: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .journey-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;

        flex-direction: column;
        gap: 4px;
        margin-bottom: 16px;

      }

        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
    </style>
  </head>

      function timeAgo(dateStr) {
        const diff = Date.now() - new Date(dateStr).getTime();
        const days = Math.floor(diff / 86400000);
        if (days < 1) return "today";
        if (days === 1) return "yesterday";
        if (days < 7) return `${days}d ago`;
        if (days < 30) return `${Math.floor(days / 7)}w ago`;
        if (days < 365) return `${Math.floor(days / 30)}mo ago`;
        return `${Math.floor(days / 365)}y ago`;
      }

      function renderStats() {
        const total = data.length;
        const interviews = data.filter((a) =>
          a.stages.some(
            (s) => s.status === "interview" || s.status === "ai_interview",
          ),
        ).length;
        const offers = data.filter((a) =>
          a.stages.some((s) => s.status === "offer"),
        ).length;
        const active = data.filter(
          (a) =>
            !a.stages.some((s) =>
              ["rejected", "withdrawn", "offer"].includes(s.status),
            ),
        ).length;
        const responseRate =
          total === 0
            ? 0
            : Math.round(
                (data.filter((a) =>
                  a.stages.some((s) => s.status !== "applied"),
                ).length /
                  total) *
                  100,
              );

        const stats = [
          { label: "Total", value: total },
          { label: "Active", value: active },
          { label: "Interviews", value: interviews },
          { label: "Offers", value: offers },
          { label: "Response Rate", value: `${responseRate}%` },
        ];

        document.getElementById("stats").innerHTML = stats
          .map(
            (s) => `
    <div class="stat">
      <div class="stat-val">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `,
          )
          .join("");
      }

        board.innerHTML = STATUS_COLUMNS.map((status) => {
          const cards = data.filter((app) =>
            app.stages.some((s) => s.status === status),
          );
          const c = STATUS_COLORS[status];

          return `
      <div class="column">
        <div class="col-header" style="background:${c.bg};border:1px solid ${c.border}">
          <span class="col-title" style="color:${c.text}">${STATUS_LABELS[status]}</span>
          <span class="col-count" style="background:${c.bg};border:1px solid ${c.border};color:${c.text}">${cards.length}</span>
        </div>
        <div>
          ${
            cards.length === 0
              ? '<div class="empty">No applications</div>'
              : cards.map((app) => renderCard(app, status)).join("")
          }
        </div>
      </div>
    `;
        }).join("");
      }

      function renderCard(app, columnStatus) {
        const c = STATUS_COLORS[columnStatus];
        const statusCount = app.stages.filter(
          (s) => s.status === columnStatus,
        ).length;
        const stageDate = (
          app.stages.find((s) => s.status === columnStatus) || app.stages[0]
        ).applied_at;
        const icon = PLATFORM_ICONS[app.platform] || "📋";

        const dots =
          app.stages.length > 1
            ? `
    <div class="dots">
      ${app.stages
        .map(
          (stage, i) => `
        <div class="dot" style="background:${STATUS_COLORS[stage.status].text}" title="${STATUS_LABELS[stage.status]}"></div>
        ${i < app.stages.length - 1 ? '<div class="dot-line"></div>' : ""}
      `,
        )
        .join("")}
    </div>
  `
            : "";

        const countBadge =
          statusCount > 1
            ? `<span class="card-count" style="background:${c.bg};border:1px solid ${c.border};color:${c.text}">×${statusCount}</span>`
            : "";

        return `
    <div class="card" 
      style="--hover-border:${c.border}"
      onmouseenter="this.style.borderColor='${c.border}'"
      onmouseleave="this.style.borderColor='var(--border)'"
      onclick="openModal('${app.company}','${app.role}')">
      <div class="card-top">
        <div style="flex:1;min-width:0">
          <div class="card-company">${app.company}</div>
          <div class="card-role">${app.role || '<span style="color:var(--muted);font-style:italic">Role not specified</span>'}</div>
        </div>
        ${countBadge}
      </div>
      ${dots}
      <div class="card-meta">
        <span class="card-platform">${icon} <span>${app.platform}</span></span>
        <span class="card-date">${timeAgo(stageDate)}</span>
      </div>
    </div>
  `;
      }

      let selectedStageId = null;

      function openModal(company, role) {
        const app = data.find((a) => a.company === company && a.role === role);
        if (!app) return;

        selectedStageId = app.stages[app.stages.length - 1].id;
        renderModal(app);
      }

      function renderModal(app) {
        const c = STATUS_COLORS[app.current_status];
        const selectedStage =
          app.stages.find((s) => s.id === selectedStageId) ||
          app.stages[app.stages.length - 1];

        const journey =
          app.stages.length > 1
            ? `
    <div class="journey-label">Journey</div>
    <div class="journey">
      ${app.stages
        .map((stage) => {
          const sc = STATUS_COLORS[stage.status];
          const isActive = stage.id === selectedStageId;
          return `
          <div class="journey-item ${isActive ? "active" : ""}" onclick="selectStage('${app.company}','${app.role}',${stage.id})">
            <span class="journey-badge" style="background:${sc.bg};color:${sc.text};border:1px solid ${sc.border}">${STATUS_LABELS[stage.status]}</span>
            <span class="journey-date">${new Date(stage.applied_at).toLocaleDateString()}</span>
            ${stage.email_body ? '<span class="journey-icon">📧</span>' : ""}
          </div>
        `;
        })
        .join("")}
    </div>
  `
            : "";

        document.getElementById("modal-container").innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div>
            <div class="modal-company">${app.company}</div>
            <div class="modal-role">${app.role || "Role not specified"}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <span class="modal-badge" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">${STATUS_LABELS[app.current_status]}</span>
            <button class="close-btn" onclick="document.getElementById('modal-container').innerHTML=''">✕</button>
          </div>
        </div>
        <div class="modal-meta">
          <span>📅 ${new Date(app.applied_at).toLocaleDateString()}</span>
          <span>🔗 ${app.platform}</span>
          <span>${app.language === "de" ? "🇩🇪 German" : "🇬🇧 English"}</span>
        </div>
        ${journey}
        <div class="email-body">
          ${
            selectedStage?.email_body
              ? selectedStage.email_body
              : '<span class="email-empty">No email content available.</span>'
          }
        </div>
      </div>
    </div>
  `;
      }

      function selectStage(company, role, stageId) {
        selectedStageId = stageId;
        const app = data.find((a) => a.company === company && a.role === role);
        if (app) renderModal(app);
      }

      function closeModal(e) {
        if (e.target.classList.contains("modal-overlay")) {
          document.getElementById("modal-container").innerHTML = "";
        }
      }

      renderStats();
      renderBoard();
    </script>
  </body>
</html>
